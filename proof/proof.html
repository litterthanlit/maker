<!doctype html><meta charset=utf-8>
<style>
@font-face{font-family:K;src:url(../fonts/variable/KantonGrotesk[wght].woff2) format("woff2");font-weight:300 700}
body{margin:24px;background:#fff;color:#000;font-family:K}
.g{font-size:88px;line-height:1.08;word-break:break-all}
.t{font-size:40px;line-height:1.2;margin:8px 0}
.l{font:12px monospace;color:#888}
</style>
<div id=root></div>
<script>
const set=["ABCDEFGHIJKLM","NOPQRSTUVWXYZ","abcdefghijklm","nopqrstuvwxyz","0123456789","!\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~"];
const w=new URLSearchParams(location.search).get("w")||"300,400,700";
let h="";
for(const x of w.split(",")){h+=`<div class=l>wght ${x}</div>`;for(const s of set)h+=`<div class=g style="font-weight:${x}">${s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</div>`;}
h+=`<div class=t style="font-weight:400">The quick brown fox jumps over the lazy dog. Hamburgefonstiv 1984</div>`;
h+=`<div class=t style="font-weight:700">Swiss Grotesk — Basel, Zürich, Helsinki</div>`;
document.getElementById("root").innerHTML=h;
</script>
